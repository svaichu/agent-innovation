# OpenAI model used by each agent. Restart the portal after a change.
models:
  intake_agent: gpt-6.2-sol
  score_agent: gpt-6.2-sol
  merge_agent: gpt-6.2-sol

# Metric files in metrics/. Each one scores every idea and gets its own column on the
# dashboard, in this order. The first one ranks the list by default.
metrics:
  - rice.md
  - feasibility.md
  - time_saved.md
