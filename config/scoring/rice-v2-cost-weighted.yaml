# AI Compass: cost-weighted scoring method
#
# Same RICE shape as v1, with two deliberate changes. Switching to this config
# is the "what happens if we change the criteria?" demonstration: the ranking
# must reorder and the dashboard must say which factor caused each move.
#
# Why a board would choose this: the 2027 internal tooling budget is EUR 250,000
# and only about 60 engineering person-days per month are allocated to internal
# work. When money is the binding constraint rather than enthusiasm, effort
# should be priced, not just counted.

name: rice
version: 2
label: "RICE v2 (cost-weighted effort)"
formula: "(reach * impact * confidence) / (effort * cost_multiplier)"
active: false

inherits: rice-v1
time_period: per month

# --- Change 1: effort is priced, not just sized -----------------------------
# A month of a senior engineer and a month of a working-student are the same
# number of person-days but not the same decision.
cost_multiplier:
  description: "Scales Effort by what the effort actually costs."
  source: derived.est_cost_eur
  bands:
    - { max: 5000,   value: 0.8, label: "under EUR 5k" }
    - { max: 20000,  value: 1.0, label: "EUR 5k to 20k - department head decides" }
    - { max: 50000,  value: 1.4, label: "EUR 20k to 50k - leadership sync decides" }
    - { max: null,   value: 2.0, label: "over EUR 50k - three quotes, board approval" }
  missing: { value: 1.0, action: flag_for_review }

# --- Change 2: scarce skills cost more than scarce money --------------------
scarcity_penalty:
  description: >-
    Applied when the idea needs a skill held by fewer than three people, or a
    person whose free capacity is already under 15%. Queueing behind a
    bottleneck is a real cost the raw effort number hides.
  source: feasibility.dimensions.skills
  rules:
    - when: unique_skill_holders <= 1
      multiply_effort_by: 1.5
      note: "single point of failure"
    - when: unique_skill_holders <= 3
      multiply_effort_by: 1.2
    - when: required_person_capacity_pct < 15
      multiply_effort_by: 1.3
      note: "the person needed has almost no free time"

# Confidence rules are inherited from v1 unchanged: honesty about evidence does
# not depend on which way the board wants to weight cost.

diff_reporting:
  # What the dashboard must show when the active config changes.
  required: true
  show:
    - rank_before_and_after
    - places_moved
    - which_factor_changed
    - factor_value_before_and_after
  explain_template: >-
    {idea_id} moved {direction} {places} places: effort {effort_before} ->
    {effort_after} after {reason}.
